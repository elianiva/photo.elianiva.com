name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Check Node version contract
        run: pnpm check:node
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm fmt -- --check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # Must stay `pnpm build`. It runs scripts/build-website.mjs, which is the
      # same Alchemy `viteBuild` call `pnpm infra:deploy` makes, with the options
      # in website.config.mjs. A client-only `vite build` here is the gate hole
      # #67 closed: the deploy artifact goes unbuilt, and a green CI ships a red
      # Deploy for as long as nobody watches it.
      - name: Build (the artifact Deploy ships)
        run: pnpm build
