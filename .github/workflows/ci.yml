name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Check Node version contract
        run: pnpm check:node
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm fmt -- --check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # `pnpm build` builds the Worker `pnpm infra:deploy` uploads: its entry
      # environment is declared in packages/web/vite.config.ts, and app mode
      # makes the package's plain `vite build` build it alongside the client.
      # CI used to build a client-only bundle nobody deploys (#67).
      - name: Build (the artifact Deploy ships)
        run: pnpm build
      # The deploy reads that bundle by path, so assert it is there. Without
      # this, deleting `environments.ssr` from vite.config.ts would leave
      # `pnpm build` green while the deploy fails — the shape of the 28 red
      # deploys behind #67.
      - name: Assert the deployed Worker bundle exists
        run: test -f packages/web/dist/ssr/worker.js
