# Mirrors .github/workflows/ci.yml so red CI is caught before it leaves the machine.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,json,html,css,md,yml}'
      run: pnpm exec vp fmt {staged_files}
      stage_fixed: true
    lint:
      run: pnpm lint

pre-push:
  commands:
    node-version:
      run: pnpm check:node
    format:
      run: pnpm fmt -- --check
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    build:
      run: pnpm build && test -f packages/web/dist/ssr/worker.js
