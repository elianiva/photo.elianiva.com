<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F0E8" />
    <!-- Everything that depends on the page — description, canonical, robots,
         Open Graph, Twitter and structured data — is written per request by
         the Worker (src/lib/seo.ts). A tag here would be on every document. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Caveat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link href="/src/styles.css" rel="stylesheet" />
    <!-- The Desk's saved theme, applied before first paint so a light Desk never
         flashes dark. Keep the key in step with `THEME_STORAGE_KEY` in
         src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('photo-admin:theme')
        if (
          (t === 'light' || t === 'dark') &&
          /^\/admin\/?$|^\/admin\/(?!photos\/)/.test(location.pathname)
        ) {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
    <title>photo.elianiva.com — Photography</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
