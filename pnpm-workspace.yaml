packages:
  - packages/*

allowBuilds:
  agent-browser: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

# CI enforces pnpm's minimum-release-age policy (rejects packages published
# within 24h). Pin transitives that float onto day-old releases back to
# proven versions until the new ones age out. Re-check ages on the next dep
# bump (`npm view <pkg> time`) and unpin whatever is older than a day.
# Unpinned 2026-09-24 (aged out): @cloudflare/unenv-preset 2.16.2,
# @oxlint/plugins 1.85.0.
overrides:
  '@aws-sdk/credential-providers': 3.1117.0
  '@cloudflare/workers-types': 5.20260825.1
  undici: 8.10.0
