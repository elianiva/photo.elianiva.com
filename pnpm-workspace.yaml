packages:
  - packages/*

allowBuilds:
  agent-browser: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true

# pnpm 11 refuses to install a version published in the last 24 hours
# (minimumReleaseAge defaults to 1440 minutes) and re-checks every lockfile
# entry against that cutoff on each install, which breaks CI as soon as a fresh
# release lands. This repo takes whatever is newest, so the wait is zero.
minimumReleaseAge: 0

# Effect is pinned to a single version across the workspace and every transitive
# Effect dependency (foldkit, alchemy and its provider packages). 4.1.4 is
# stable, and the Alchemy 2.0.0-beta.87 provider packages are built against it,
# so the workspace carries no Effect compatibility patches.
overrides:
  '@effect/platform-browser': 4.1.4
  '@effect/platform-bun': 4.1.4
  '@effect/platform-node': 4.1.4
  '@effect/platform-node-shared': 4.1.4
  '@effect/sql-d1': 4.1.4
  '@effect/sql-sqlite-do': 4.1.4
  '@effect/sql-sqlite-node': 4.1.4
  '@effect/vitest': 4.1.4
  effect: 4.1.4
  # Vite+ 1.7.0 bundles Vitest 5.1.0. One copy keeps `vp` and the packages'
  # own `vitest` runs on the same runner instead of splitting the internals.
  vitest: 5.1.0
  # Alchemy's platform packages ask for undici 8.12.4; one copy keeps the tree
  # flat.
  undici: 8.12.4
