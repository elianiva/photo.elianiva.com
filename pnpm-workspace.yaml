packages:
  - packages/*

allowBuilds:
  agent-browser: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

# pnpm 11 refuses to install a version published in the last 24 hours
# (minimumReleaseAge defaults to 1440 minutes) and re-checks every lockfile
# entry against that cutoff on each install, which breaks CI as soon as a fresh
# release lands. This repo takes whatever is newest, so the wait is zero.
minimumReleaseAge: 0

# Effect is pinned to a single version across the workspace and every transitive
# Effect dependency (foldkit, alchemy and its provider packages). 4.0.0 is
# stable. Two of those dependencies still ship pre-stable code and are patched
# to run on it; drop each patch when its upstream release is built against
# Effect 4.0.0 (`npm view <pkg> peerDependencies`):
#
# - foldkit: since 4.0.0-rc.118 `Schema.make` is a memoizing getter on the
#   schema prototype; foldkit wraps schemas in a Proxy that forwards `get` with
#   itself as the receiver, so the memoization lands on the Proxy and a second
#   read throws "Cannot redefine property: make". The patch makes the wrapper a
#   transparent view of the schema.
# - alchemy, @alchemy.run/cloudflare-runtime, @distilled.cloud/*: they
#   import `effect/unstable/<area>` modules that graduated in 4.0.0 (`httpapi`
#   became `effect/http-api`; the rest lost the `unstable/` segment), and the
#   flat `effect/Encoding` base64 helpers that became `effect/encoding`'s Base64
#   and Base64Url modules. The patches only rewrite those specifiers and calls.
overrides:
  '@effect/platform-browser': 4.0.0
  '@effect/platform-bun': 4.0.0
  '@effect/platform-node': 4.0.0
  '@effect/platform-node-shared': 4.0.0
  '@effect/sql-d1': 4.0.0
  '@effect/sql-sqlite-do': 4.0.0
  '@effect/sql-sqlite-node': 4.0.0
  '@effect/vitest': 4.0.0
  effect: 4.0.0
  # alchemy asks for undici 7; this flattens the tree onto the current line
  # instead of carrying a second copy of undici.
  undici: 8.11.2

patchedDependencies:
  '@alchemy.run/cloudflare-runtime@2.0.0-beta.79': patches/@alchemy.run+cloudflare-runtime@2.0.0-beta.79.patch
  '@distilled.cloud/aws@1.0.0-rc.12': patches/@distilled.cloud+aws@1.0.0-rc.12.patch
  '@distilled.cloud/axiom@1.0.0-rc.12': patches/@distilled.cloud+axiom@1.0.0-rc.12.patch
  '@distilled.cloud/cloudflare@1.0.0-rc.12': patches/@distilled.cloud+cloudflare@1.0.0-rc.12.patch
  '@distilled.cloud/core@1.0.0-rc.12': patches/@distilled.cloud+core@1.0.0-rc.12.patch
  '@distilled.cloud/fly-io@1.0.0-rc.12': patches/@distilled.cloud+fly-io@1.0.0-rc.12.patch
  '@distilled.cloud/hetzner@1.0.0-rc.12': patches/@distilled.cloud+hetzner@1.0.0-rc.12.patch
  '@distilled.cloud/neon@1.0.0-rc.12': patches/@distilled.cloud+neon@1.0.0-rc.12.patch
  '@distilled.cloud/planetscale@1.0.0-rc.12': patches/@distilled.cloud+planetscale@1.0.0-rc.12.patch
  '@distilled.cloud/prisma@1.0.0-rc.12': patches/@distilled.cloud+prisma@1.0.0-rc.12.patch
  '@distilled.cloud/railway@1.0.0-rc.12': patches/@distilled.cloud+railway@1.0.0-rc.12.patch
  '@distilled.cloud/stripe@1.0.0-rc.12': patches/@distilled.cloud+stripe@1.0.0-rc.12.patch
  alchemy@2.0.0-beta.79: patches/alchemy@2.0.0-beta.79.patch
  foldkit@0.164.0: patches/foldkit@0.164.0.patch
